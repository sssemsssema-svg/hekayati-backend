services:
  - type: web
    name: hekayati-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: IMAGE_BACKEND
        value: mock
